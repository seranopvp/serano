<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Instant Sounds</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="container">
    <h1>Instant Sounds</h1>

    <div class="grid">
      <button class="sound" data-sound="click">Click</button>
      <button class="sound" data-sound="boom">Boom</button>
      <button class="sound" data-sound="bruh">Bruh</button>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
